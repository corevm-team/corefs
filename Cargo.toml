[workspace]
members = [
    ".",
    "corefs-core",
    "corefs-tools",
    "corefs-std",
    "corefs-fuse-proto",
    "corefs-fuse-adapter",
    "corefs-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.19"
edition = "2024"
license = "MIT"
authors = ["Mike Strathmann"]

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
bincode = { version = "2.0", default-features = false, features = ["alloc", "serde"] }
lz4_flex = { version = "0.11", default-features = false }

[package]
name = "corefs"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
corefs-core = { path = "corefs-core", features = ["std"] }
bincode = { workspace = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
lz4_flex = { workspace = true, features = ["frame"] }
serde = { workspace = true, features = ["std"] }
serde_json = "1"

[features]
default = []
windows-winfsp = ["dep:windows", "dep:winfsp", "dep:winfsp-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.14"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
winfsp = { version = "0.12.4", optional = true, default-features = false, features = ["system"] }
winfsp-sys = { version = "0.12.1", optional = true }

[patch.crates-io]
winfsp-sys = { path = "vendor/winfsp-sys" }
