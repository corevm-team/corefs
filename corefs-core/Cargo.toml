[package]
name = "corefs-core"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "CoreFS core — plattformneutrale, no_std-fähige Domain- und Storage-Logik für das CoreFS-Dateisystem."

[features]
default = []
# `std` aktiviert std-Bequemlichkeiten (Display, std::error::Error-Impls,
# From-Konvertierungen von std::time::SystemTime, …) und zieht die
# `getrandom`-Erweiterung von `chacha20poly1305` nach, damit die bequeme
# `EncryptionService::encrypt`-Variante (mit OS-CSPRNG-Nonce) verfügbar
# ist. Ohne `std` ist die Crate strikt `no_std + alloc` und nutzt
# `EncryptionService::encrypt_with_rng(plaintext, &mut dyn Rng)` —
# der Aufrufer liefert eine eigene CSPRNG-Implementierung.
std = ["chacha20poly1305/getrandom"]

[dependencies]
serde = { workspace = true }
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "inline-more", "serde"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
bincode = { workspace = true }

[dev-dependencies]
serde_json = "1"
