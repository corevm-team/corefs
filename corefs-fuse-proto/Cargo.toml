[package]
name = "corefs-fuse-proto"
version = "0.1.19"
edition = "2024"
license = "MIT"
description = "AnyOS-natives Wire-Format für das CoreFS-FUSE-Subsystem (Request/Reply-Enums, optional bincode-Kodierung)."

[features]
default = []
# Aktiviert std-seitige Bequemlichkeiten. `bincode` ist seit der
# Wave-5-Migration unconditional verfügbar (no_std-fähige Variante 2.x);
# die `wire`-Encode/Decode-Helfer sind damit stets verfügbar.
std = []

[dependencies]
# Inline-Versionen (statt workspace = true), damit die Crate auch von
# Workspaces ausserhalb des corefs-Repos (z. B. AnyOS-Kernel) als
# Path-Dependency konsumiert werden kann.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
bincode = { version = "2.0", default-features = false, features = ["alloc", "serde"] }
